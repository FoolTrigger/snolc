name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build snolc Stealth APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain and Targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Accept Android SDK Licenses & Prepare NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" || true

      - name: Build snolc Core and Native Modules with Cargo
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a

          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
              export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
            else
              export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            fi
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH=$TOOLCHAIN:$PATH

          PACKAGES="-p snolc -p snolc-adapter-tun -p snolc-carrier-tcp -p snolc-protection-noise -p snolc-policy-local"

          # aarch64 (arm64-v8a)
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang
          cargo build --release --target aarch64-linux-android $PACKAGES
          cp target/aarch64-linux-android/release/libsnolc*.so android/app/src/main/jniLibs/arm64-v8a/

          # armv7 (armeabi-v7a)
          export CC_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi24-clang
          export AR_armv7_linux_androideabi=$TOOLCHAIN/llvm-ar
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi24-clang
          cargo build --release --target armv7-linux-androideabi $PACKAGES
          cp target/armv7-linux-androideabi/release/libsnolc*.so android/app/src/main/jniLibs/armeabi-v7a/

          echo "Listing bundled JNI libraries for arm64-v8a:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          echo "Listing bundled JNI libraries for armeabi-v7a:"
          ls -la android/app/src/main/jniLibs/armeabi-v7a/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/snolc-stealth.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snolc-stealth-apk
          path: output/snolc-stealth.apk
          if-no-files-found: error
          retention-days: 30
