name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build snolc Stealth APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Accept Android SDK Licenses & Prepare NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/snolc-stealth.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snolc-stealth-apk
          path: output/snolc-stealth.apk
          if-no-files-found: error
          retention-days: 30
