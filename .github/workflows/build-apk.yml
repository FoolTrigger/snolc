name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build snolc Stealth APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/snolc-stealth.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snolc-stealth-apk
          path: output/snolc-stealth.apk
          if-no-files-found: error
          retention-days: 30
